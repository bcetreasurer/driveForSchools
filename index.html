<script>
  const originalFetch = window.fetch;

  window.fetch = async function(...args) {

    const url = String(args[0]);

    const response =
      await originalFetch.apply(this, args);

    if (url.includes("/ncp/api/cart/form-fields/")) {

      console.log("PAYPAL API RESPONSE:", url);
      console.log("HTTP STATUS:", response.status);

      // Clone it so PayPal can still consume the original response.
      const clone = response.clone();

      try {
        const data = await clone.json();

        console.log("PAYPAL FORM FIELDS:", data);
        console.log("PAYPAL HTML:", data.html);
        console.log("PAYPAL HTML SCRIPT:", data.html_script);

      } catch (error) {
        console.log(
          "Could not decode PayPal response as JSON:",
          error
        );
      }
    }

    return response;
  };
</script>
